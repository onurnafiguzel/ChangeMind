apiVersion: 1

groups:
  - orgId: 1
    name: changemind-alerts
    folder: ChangeMind
    interval: 1m
    rules:
      - uid: high-500-errors
        title: "Yüksek 500 Hata Sayısı"
        condition: A
        data:
          - refId: A
            relativeTimeRange:
              from: 3600
              to: 0
            datasourceUid: prometheus
            model:
              expr: 'increase(http_requests_received_total{code="500"}[1h]) > 10'
              instant: true
              refId: A
        noDataState: OK
        execErrState: Alerting
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Son 1 saatte 500 hata sayısı eşiği aştı"
          description: "{{ $labels.job }} servisinde son 1 saatte {{ $value | humanize }} adet 500 hatası tespit edildi."

      - uid: high-response-time
        title: "Yüksek Yanıt Süresi (p95 > 2s)"
        condition: A
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: "histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m])) > 2"
              instant: true
              refId: A
        noDataState: OK
        execErrState: Alerting
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "p95 yanıt süresi 2 saniyeyi aştı"
          description: "{{ $labels.job }} servisinde p95 yanıt süresi {{ $value | humanizeDuration }} olarak ölçüldü."
