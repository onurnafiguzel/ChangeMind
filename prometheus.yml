global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: changemind-gateway
    static_configs:
      - targets: ['host.docker.internal:5000']
    metrics_path: /metrics

  - job_name: changemind-api
    static_configs:
      - targets: ['host.docker.internal:5123']
    metrics_path: /metrics
